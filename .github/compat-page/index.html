<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NotDC-PS3 Compatibility</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --text: #1f2328;
    --muted: #59636e;
    --line: #d8dee4;
    --accent: #e8590c;
    --perfect: #0969da;
    --playable: #1a7f37;
    --in-game: #bf8700;
    --menus-intro: #d1570f;
    --boots: #cf222e;
    --nothing: #6e7781;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --text: #e6edf3;
      --muted: #9198a1;
      --line: #30363d;
      --accent: #ff8a3d;
      --perfect: #4493f8;
      --playable: #3fb950;
      --in-game: #d29922;
      --menus-intro: #f0883e;
      --boots: #f85149;
      --nothing: #8b949e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
  h1 { margin: 0; font-size: 28px; line-height: 1.2; }
  h1 span { color: var(--accent); }
  #report {
    padding: 8px 14px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }
  #report:hover { background: var(--accent); color: var(--panel); }
  #report:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
  #search {
    width: 100%;
    max-width: 420px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    font: inherit;
  }
  #search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #filters { display: flex; flex-wrap: wrap; gap: 8px; }
  #filters button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  #filters button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  #filters button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--c); }
  #count { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  th, td { padding: 10px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  th { font-size: 13px; color: var(--muted); font-weight: 600; }
  tbody tr:last-child td { border-bottom: 0; }
  td.name { font-weight: 600; width: 28%; }
  td.status { width: 160px; white-space: nowrap; }
  td.desc { white-space: pre-line; overflow-wrap: anywhere; }
  .badge { display: inline-flex; align-items: center; gap: 6px; }
  #message { padding: 24px 0; color: var(--muted); }
  @media (max-width: 640px) {
    thead { display: none; }
    table, tbody, tr, td { display: block; width: auto; }
    tr { padding: 10px 14px; border-bottom: 1px solid var(--line); }
    tbody tr:last-child { border-bottom: 0; }
    td { padding: 2px 0; border: 0; }
    td.name, td.status { width: auto; }
    td.desc { color: var(--muted); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>NotDC-PS3</span> Compatibility</h1>
    <a id="report" hidden>Send a report</a>
  </header>
  <div class="controls">
    <input id="search" type="search" placeholder="Search by name" aria-label="Search by name" autocomplete="off">
    <div id="filters" role="group" aria-label="Filter by compatibility"></div>
  </div>
  <p id="count" aria-live="polite"></p>
  <table hidden>
    <thead><tr><th>Name</th><th>Compatibility</th><th>Description</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p id="message">Loading...</p>
</div>
<script>
(function () {
  var games = [], statuses = [], current = "All";
  var search = document.getElementById("search");
  var filters = document.getElementById("filters");
  var rows = document.getElementById("rows");
  var table = document.querySelector("table");
  var count = document.getElementById("count");
  var message = document.getElementById("message");

  // Folds case and accents, so "pokemon" finds "Pokémon".
  function fold(s) {
    return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  }
  function slug(s) {
    return s.toLowerCase().replace(/[^a-z]+/g, "-").replace(/^-|-$/g, "");
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function badge(status) {
    var b = el("span", "badge");
    var d = el("span", "dot");
    d.style.setProperty("--c", "var(--" + slug(status) + ")");
    b.append(d, el("span", null, status));
    return b;
  }

  function buildFilters() {
    ["All"].concat(statuses).forEach(function (s) {
      var b = el("button");
      b.type = "button";
      b.dataset.status = s;
      b.append(s === "All" ? el("span", null, "All") : badge(s), el("span", "n"));
      b.addEventListener("click", function () { current = s; render(); });
      filters.append(b);
    });
  }

  function render() {
    var q = fold(search.value.trim());
    var byName = games.filter(function (g) { return !q || g.fold.indexOf(q) !== -1; });
    var shown = byName.filter(function (g) { return current === "All" || g.status === current; });

    // Counts follow the name search, so each button says how many matches it holds.
    Array.prototype.forEach.call(filters.children, function (b) {
      var s = b.dataset.status;
      var n = s === "All" ? byName.length : byName.filter(function (g) { return g.status === s; }).length;
      b.setAttribute("aria-pressed", String(s === current));
      b.querySelector(".n").textContent = n;
    });

    rows.textContent = "";
    shown.forEach(function (g) {
      var tr = el("tr");
      var status = el("td", "status");
      status.append(badge(g.status));
      tr.append(el("td", "name", g.name), status, el("td", "desc", g.description));
      rows.append(tr);
    });

    count.textContent = shown.length + (shown.length === 1 ? " game" : " games");
    table.hidden = shown.length === 0;
    message.hidden = shown.length !== 0;
    message.textContent = games.length ? "No games match." : "No games yet.";
  }

  search.addEventListener("input", render);

  fetch("compat.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      if (data.repo) {
        var report = document.getElementById("report");
        report.href = "https://github.com/" + data.repo + "/issues/new?template=game_compatibility.yml";
        report.hidden = false;
      }
      statuses = data.statuses;
      games = data.games.map(function (g) { g.fold = fold(g.name); return g; });
      buildFilters();
      render();
    })
    .catch(function () { message.textContent = "Could not load the list."; });
})();
</script>
</body>
</html>
